[workspace]
members = [".", "e2e/stub-decider"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/coo-quack/vigilant-heron"

# Shared by every crate in the workspace. Clippy's `allow-*-in-tests` options in
# clippy.toml relax the panic-style lints inside `#[test]` code only.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
# `pub` items that are not reachable from outside the crate must be
# `pub(crate)`, so `dead_code` can see them and reject the unused ones.
unreachable_pub = "deny"
dead_code = "deny"
unused = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# The proxy parses attacker-controlled input, so code paths that can panic on
# bad data are rejected outright rather than reviewed case by case.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[package]
name = "vigilant-heron"
version = "0.1.0"
description = "Router that checks web requests with typed decision models and blocks, redirects or passes them"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
form_urlencoded = "1.2.2"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring", "tls12", "http1", "logging", "native-tokio"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "client-legacy", "http1"] }
percent-encoding = "2.3.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-std"] }
tower-service = "0.3.3"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
proptest = "1.12.0"
rstest = "0.28.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "test-util"] }
