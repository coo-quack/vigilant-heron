# Built-in rules, compiled into the binary with include_str!.
#
# Each rule is a high-confidence signature of an attack. The rules are
# written to miss an attack rather than block ordinary traffic. Anything
# that could appear in a code paste, a forum post about SQL or HTML, a
# base64 blob or Japanese text is left to the decision model or to a user
# rule. Regexes are matched against the normalized inputs described in the
# README, so a single percent-encoding is already undone.
#
# Disable a rule with "disable_rule <id>;" in the configuration. A rule written
# with "default off;" runs only where "enable_rule <id>;" names it. The ids are
# part of the interface: do not rename one without a changelog entry.

# SQL injection

rule vh-sqli-001 {
    description "UNION SELECT in a query string";
    action block;
    query ~* "\bunion\b[\s/*()+]*(all\s+|distinct\s+)?select\b";
}

rule vh-sqli-002 {
    description "Quote followed by a tautology and a comment terminator";
    action block;
    any ~* "['\"]\s*(or|and)\s+['\"]?[0-9a-z_]+['\"]?\s*=\s*['\"]?[0-9a-z_]+['\"]?\s*(--|#|/\*)";
}

rule vh-sqli-003 {
    description "Quote followed by a stacked destructive statement";
    action block;
    any ~* "'\s*;\s*(drop|shutdown|exec|execute|truncate)\b";
}

rule vh-sqli-004 {
    description "Time-based SQL function after a quote or a closing parenthesis";
    action block;
    any ~* "(['\")]\s*(and|or|;)?\s*(sleep|pg_sleep|benchmark)\s*\()|(waitfor\s+delay\s+')";
}

# Cross-site scripting

rule vh-xss-001 {
    description "Script tag in a query string";
    action block;
    query ~* "<\s*script[\s>/]";
}

rule vh-xss-002 {
    description "javascript: URL in a query string";
    action block;
    query ~* "javascript\s*:";
}

rule vh-xss-003 {
    description "Inline event handler in markup in a query string";
    action block;
    query ~* "<[a-z][^>]{0,80}\son[a-z]{3,20}\s*=";
}

# Path traversal

rule vh-traversal-001 {
    description "Parent directory sequence in a query string";
    action block;
    query ~* "(\.|%2e){2}(/|\\\\|%2f|%5c)";
}

rule vh-traversal-002 {
    description "Sensitive system file named in a query string";
    action block;
    query ~* "etc/(passwd|shadow)|win\.ini|boot\.ini|/proc/self/";
}

rule vh-traversal-003 {
    description "Sensitive system file named in the path";
    action block;
    path ~* "etc/(passwd|shadow)|win\.ini|boot\.ini|/proc/self/";
}

# Command injection

rule vh-cmdi-001 {
    description "Shell separator followed by a common command in a query string";
    action block;
    query ~* "[;|&`]\s*(cat|id|whoami|uname|wget|curl|nc|bash|sh)\s*(\s|$|;|\||&)";
}

rule vh-cmdi-002 {
    description "Command substitution with a dollar sign in a query string";
    action block;
    query ~ "\$\([a-z/\\\\]";
}

rule vh-cmdi-003 {
    description "Backtick command substitution in a query string";
    action block;
    query ~* "`\s*(cat|id|whoami|uname|wget|curl)\b";
}

# File inclusion

rule vh-lfi-001 {
    description "PHP stream wrapper in any input";
    action block;
    any ~* "php://(filter|input|memory|temp|fd)";
}

rule vh-lfi-002 {
    description "Base64 data URI with a MIME type in a query string";
    action block;
    query ~* "data:[a-z]+/[a-z0-9.+-]+;\s*base64,";
}

rule vh-lfi-003 {
    description "expect:// wrapper in a query string";
    action block;
    query ~* "expect://";
}

rule vh-lfi-004 {
    description "Remote URL in a file, page or include parameter";
    action block;
    query ~* "(^|&)(file|template|include|inc|require|page)=\s*(https?|ftp)://";
}

# Server-side request forgery

rule vh-ssrf-001 {
    description "Cloud metadata address in any input";
    action block;
    any ~ "169\.254\.169\.254";
}

rule vh-ssrf-002 {
    description "file, gopher, dict, ldap or tftp URL in a query string";
    action block;
    query ~* "(^|[=&/ ])(file|gopher|dict|ldap|tftp)://";
}

# Template and expression injection

rule vh-expr-001 {
    description "JNDI lookup in the Log4Shell form";
    action block;
    any ~* "\$\{[^}]{0,40}jndi\s*:";
}

rule vh-expr-002 {
    description "Template probe that multiplies 7 by 7";
    action block;
    any ~ "\{\{\s*7\s*\*\s*7\s*\}\}|\$\{\s*7\s*\*\s*7\s*\}";
}

rule vh-expr-003 {
    description "Spring class loader property path";
    action block;
    any ~* "class\.module\.classloader";
}

# XML external entities

rule vh-xxe-001 {
    description "External entity declared with SYSTEM in a body";
    action block;
    body ~* "<!ENTITY\s+[^>]{0,80}\bSYSTEM\s+[\"']";
}

# Known scanners

rule vh-scanner-001 {
    description "User agent of a known vulnerability scanner";
    action block;
    header user-agent ~* "\b(sqlmap|nikto|nuclei|masscan|zgrab|acunetix|havij|commix|wpscan|dirbuster|gobuster|nmap)\b";
}

# Known-exploited product flaws. A virtual patch blocks a whole endpoint, so
# each one is off by default and runs only on the sites that enable it. See
# docs/cve-rules.md for the policy.

# IBM Langflow OSS CVE-2026-9103

rule vh-cve-2026-9103 {
    description "IBM Langflow OSS CVE-2026-9103: /api/v1/login/auto_login issues superuser tokens without authentication when AUTO_LOGIN is enabled, which is the default. Upgrade to Langflow 1.10.1, IBM's fixed release, or a later one. Bulletin: https://www.ibm.com/support/pages/node/7278926";
    default off;
    action block;
    path ~* "^/api/v1/login/auto_login";
}

# IBM Langflow OSS CVE-2026-8481

rule vh-cve-2026-8481 {
    description "IBM Langflow OSS CVE-2026-8481: POST /api/v1/validate/code runs user-supplied Python through exec() without a sandbox. Upgrade Langflow beyond 1.10.0; check the vendor bulletin for the fixed version: https://www.ibm.com/support/pages/node/7278923";
    default off;
    action block;
    method POST;
    path ~* "^/api/v1/validate/code";
}
