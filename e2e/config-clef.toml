listen = "0.0.0.0:8080"
log_format = "json"
client_ip_header = "x-real-ip"

[decision]
backend = "clef"
model = "clef-flash"
url = "http://stub-decider:9000/client/v4/accounts/test/ai/run/@cf/cloudflare/clef-flash"
api_token_env = "E2E_CLEF_TOKEN"
timeout_ms = 300
inspect_body_bytes = 8192
max_body_bytes = 10485760
redact_headers = []

[default]
status = 421

[[sites]]
hosts = ["clef.test"]
upstream = "http://upstream:80"
mode = "enforce"
action = "block"
block_threshold = 0.9
instruction_threshold = 0.5
debug_headers = false
