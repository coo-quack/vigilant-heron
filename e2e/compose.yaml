name: vigilant-heron-e2e

services:
  edge:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - vigilant-heron
    configs:
      - source: edge_conf
        target: /etc/nginx/conf.d/default.conf

  vigilant-heron:
    build:
      context: ..
      target: runtime
    volumes:
      - ./config.toml:/etc/vigilant-heron/config.toml:ro
    depends_on:
      - stub-decider
      - upstream

  stub-decider:
    build:
      context: ..
      target: stub-decider

  upstream:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    configs:
      - source: upstream_conf
        target: /etc/nginx/conf.d/default.conf

configs:
  edge_conf:
    content: |
      server {
        listen 80;

        location / {
          proxy_pass http://vigilant-heron:8080;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
        }
      }

  upstream_conf:
    content: |
      server {
        listen 80;

        location = /style.css {
          default_type text/css;
          return 200 "body { color: #222; }\n";
        }

        location / {
          default_type text/plain;
          return 200 "upstream ok\n";
        }
      }
