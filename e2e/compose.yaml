name: vigilant-heron-e2e

services:
  edge:
    image: nginx:1.31-alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - vigilant-heron
      - vigilant-heron-clef
      - vigilant-heron-jev
    configs:
      - source: edge_conf
        target: /etc/nginx/conf.d/default.conf

  vigilant-heron:
    build:
      context: ..
      target: runtime
    volumes:
      - ./vigilant-heron.conf:/etc/vigilant-heron/vigilant-heron.conf:ro
      - ./rules.d:/etc/vigilant-heron/rules.d:ro
    depends_on:
      - stub-decider
      - upstream

  vigilant-heron-clef:
    build:
      context: ..
      target: runtime
    volumes:
      - ./config-clef.conf:/etc/vigilant-heron/vigilant-heron.conf:ro
    environment:
      # Test-only token. The stub decider accepts exactly this bearer token.
      E2E_CLEF_TOKEN: test-token
    depends_on:
      - stub-decider
      - upstream

  vigilant-heron-jev:
    build:
      context: ..
      target: runtime
    volumes:
      - ./config-jev.conf:/etc/vigilant-heron/vigilant-heron.conf:ro
    environment:
      # Test-only token. The stub decider accepts exactly this bearer token.
      E2E_JEV_TOKEN: test-token
    depends_on:
      - stub-decider
      - upstream

  stub-decider:
    build:
      context: ..
      target: stub-decider

  upstream:
    image: nginx:1.31-alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    configs:
      - source: upstream_conf
        target: /etc/nginx/conf.d/default.conf

configs:
  edge_conf:
    content: |
      server {
        listen 80;
        # Above the router's 1 MB default, so the router decides on uploads.
        client_max_body_size 10m;

        location / {
          proxy_pass http://vigilant-heron:8080;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
        }
      }

      server {
        listen 80;
        server_name clef.test;

        location / {
          proxy_pass http://vigilant-heron-clef:8080;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
        }
      }

      server {
        listen 80;
        server_name jev.test;

        location / {
          proxy_pass http://vigilant-heron-jev:8080;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
        }
      }

  upstream_conf:
    content: |
      server {
        listen 80;

        location = /style.css {
          default_type text/css;
          return 200 "body { color: #222; }\n";
        }

        # Held for one second by the stub echo, so a concurrent request overlaps it.
        location /hold {
          proxy_pass http://stub-decider:9000/echo/hold;
        }

        location / {
          default_type text/plain;
          return 200 "upstream ok\n";
        }
      }
