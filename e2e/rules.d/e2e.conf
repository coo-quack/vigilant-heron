# Rules used only by the e2e suite. The router reads this file through the
# include in vigilant-heron.conf; compose.yaml mounts this directory.

# A catalog search skips the decision model on enforce.test. The e2e suite sends
# an attack-shaped query to it and expects the upstream answer.
rule e2e-skip-catalog {
    description "catalog search skips the model in the e2e suite";
    action skip;
    site enforce.test;
    path = /catalog;
}
