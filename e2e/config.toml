listen = "0.0.0.0:8080"
log_format = "json"
client_ip_header = "x-real-ip"

[decision]
url = "http://stub-decider:9000/decide"
timeout_ms = 300
inspect_body_bytes = 8192
max_body_bytes = 10485760
redact_headers = []

[default]
status = 421

[[sites]]
hosts = ["enforce.test"]
upstream = "http://upstream:80"
mode = "enforce"
action = "block"
block_threshold = 0.9
instruction_threshold = 0.5
deny_paths = ["/xmlrpc.php"]
fail_closed_paths = ["/wp-login.php"]
debug_headers = false

[[sites]]
hosts = ["redirect.test"]
upstream = "http://upstream:80"
mode = "enforce"
action = "redirect"
redirect_to = "https://example.com/blocked"
block_threshold = 0.9
instruction_threshold = 0.5
debug_headers = false

[[sites]]
hosts = ["shadow.test"]
upstream = "http://upstream:80"
mode = "shadow"
action = "block"
block_threshold = 0.9
instruction_threshold = 0.5
debug_headers = true
