# Optional skip rules for a WordPress site. They ask the decision model less often for
# requests that WordPress sends all the time and that a verdict hardly changes.
#
# To use them, copy this file to rules.d/ next to your configuration, and include it
# from the top level:
#   include rules.d/wordpress.conf;
#
# Every rule here is a skip: a matching request is forwarded without a call to the
# decision backend. Block rules, built-in and your own, still run first, so a request
# that a block rule matches is blocked even when one of these rules also matches.
#
# The rules have no site line, so they apply to every site in the configuration. To
# limit one rule to a site, add a site line inside its block, with the name of a
# configured site, such as:
#   site www.example.com;

# The front page with WordPress's numeric query parameters (p, page_id, paged, cat, m,
# attachment_id), feeds and sitemaps. Trade: a page view with these shapes gets no model
# verdict. The values are digits, or letters, digits and hyphens for a sitemap name, so
# no markup or quote can match.
rule wp-public-pages {
    description "WordPress front page with numeric parameters, feeds and sitemaps";
    action skip;
    method GET HEAD;
    path = /;
    query ~ "^((p|page_id|paged|cat|m|attachment_id)=[0-9]+(&(p|paged|cat|m)=[0-9]+)?|feed=(rss2|atom)(&p=[0-9]+)?|sitemap=[a-z0-9-]+(&paged=[0-9]+)?)?$";
}

# The login form and the redirects to it from wp-admin. Trade: a GET with a query that no
# built-in rule catches gets no model verdict. A POST carries the credentials and still
# goes to the model.
rule wp-login-page {
    description "WordPress login page, GET and HEAD with any query";
    action skip;
    method GET HEAD;
    path = /wp-login.php;
}

# The admin screens' concatenated scripts and styles. Trade: only the handle names and
# the version are allowed, so a request with any other parameter goes to the model.
rule wp-admin-assets {
    description "WordPress admin script and style loaders, with handle names only";
    action skip;
    method GET HEAD;
    path ~ "^/wp-admin/load-(scripts|styles)\.php$";
    query ~ "^c=[01](&dir=(ltr|rtl))?(&load\[chunk_[0-9]\]=[A-Za-z0-9,_-]*)+&ver=[A-Za-z0-9._-]{1,40}$";
}

# robots.txt without a query. Trade: almost nothing, since the file is a few lines of text.
rule wp-robots {
    description "robots.txt with no query";
    action skip;
    method GET HEAD;
    path = /robots.txt;
    query ~ "^$";
}
