# Sample rules in the rule syntax. Nothing here is active: every line is a comment.
# Include this file from the top level of vigilant-heron.conf to use it, for example:
#   include rules.d/*.conf;
#
# A rule is checked against the normalized request (see the README). Every
# condition the rule lists must match. Block rules run before skip rules.

