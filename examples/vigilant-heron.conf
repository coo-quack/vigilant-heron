# Sample configuration for vigilant-heron.
#
# Syntax, as in nginx:
#   directive arguments;            a simple directive ends with a semicolon
#   directive arguments { ... }     a block holds more directives
#   # starts a comment that runs to the end of the line
#   Quote arguments that contain spaces, with "double" or 'single' quotes.
#   include <path-or-glob>;         at the top level only. A relative path is
#                                   relative to the directory of this file.
#
# Times take ms, s, m or h (a bare number is seconds). Sizes take k, m or g
# (a bare number is bytes). Booleans are on and off.
#
# Every value below is the default unless the comment says it is required.

# Address the proxy binds to. Required.
listen 0.0.0.0:8080;

# Runtime worker threads. Unset means one per CPU core. At least 1 when set.
# worker_threads 4;

# Most client connections served at the same time. At least 1.
max_connections 1024;

# Connection timers and header limits, as in nginx. They apply before the Host
# selects a site, so they are set here only. Each value below is the default.
# client_header_timeout 60s;        # time to receive a whole request header
# keepalive_timeout 75s;            # idle time between requests; 0 disables keep-alive
# keepalive_requests 1000;          # requests per connection; the last one closes it
# send_timeout 60s;                 # longest wait between two writes to the client
# large_client_header_buffers 4 8k; # request line up to 8k (414), header field up to 8k (400), section up to 32k (400)

# Lingering close: after a response to a request whose body the router did not
# read (a 413, 403 or 408 sent early), the router half-closes and discards the
# client's remaining bytes, so the client reads the response instead of a reset.
# on lingers only when request data was left unread; always lingers after every
# response to a request; off closes at once.
# lingering_close on;               # on, always or off
# lingering_time 30s;               # longest total time of one lingering close
# lingering_timeout 5s;             # longest silence, with no client data, before it closes

# Largest request body in bytes, for every site that does not set its own.
# 0 is unlimited. Larger bodies get 413 before they are read. Replaces max_body.
# client_max_body_size 1m;

# Status for requests whose Host matches no site. Must be 4xx or 5xx.
default_status 421;

# Optional. Header whose value is logged as $request_id. It is not sent to the
# decision backend.
# request_id_header X-Request-Id;

# Client address. The header below is believed only when the peer is one of
# the trusted proxies. Without a trusted peer the client is the peer address.
# real_ip_from 10.0.0.0/8 192.0.2.1;
# real_ip_header X-Real-IP;
# real_ip_recursive off;   # on: walk the header from the right, skipping trusted hops

# Access list, as in nginx: allow or deny by client address, an address, a CIDR
# network or all. The entries are checked in order and the first one that covers
# the client decides; a client no entry covers is allowed. A denied client gets
# 403 before anything else runs, and the site action does not apply.
# deny all;
# allow 192.0.2.0/24;

# Built-in rules: high-confidence signatures compiled into the binary, on by
# default. Turn all of them off, or disable single ids (listed in the README).
# builtin_rules on;
# disable_rule vh-scanner-001;

# Rules in nginx syntax, from files. A relative path is relative to this file.
# rules.d/local.conf has commented samples.
# include rules.d/*.conf;

# The decision backend. Required.
decision {
    # http: the JSON protocol described in the README.
    # clef: Cloudflare Clef on Workers AI, or a server that speaks its protocol.
    # jev:  TypeSafe Jev, or a server that speaks the same System One protocol.
    # Defaults to jev.
    backend jev;

    # Absolute http:// or https:// URI. Required with http and clef. With jev it
    # defaults to https://api.typesafe.ai/v1/systemone.
    # For clef use https://api.cloudflare.com/client/v4/accounts/<ACCOUNT_ID>/ai/run/@cf/cloudflare/clef-flash
    # url https://api.typesafe.ai/v1/systemone;

    # clef: clef-flash or clef (required). jev: a model identifier of 1 to 100
    # characters from A-Za-z0-9._- (default jev-latest). Not valid with http.
    # model clef-flash;

    # The NAME of an environment variable that holds the bearer token. The token
    # itself is never written here. Required with clef; jev defaults to
    # TYPESAFE_API_KEY. The process fails to start when the variable is unset or
    # blank. Not valid with http.
    # api_token_env CLOUDFLARE_AI_TOKEN;

    # Time allowed for one decision, including any wait for a slot.
    timeout 300ms;

    # Longest wait for a free slot. Zero (default) means no queueing: a request
    # that finds no free slot is backend_busy at once. Must not exceed timeout.
    queue_timeout 0;

    # Most decision-backend calls in flight at the same time. At least 1.
    max_concurrency 64;

    # Bytes of the request body sent to the backend. The cut falls on a UTF-8
    # character boundary, and body_truncated is set. The rest of the body is
    # streamed to the upstream after the decision, not buffered.
    inspect_body 8k;

    # Extra header names removed before the event is sent to the backend.
    # cookie, authorization, proxy-authorization, x-api-key and x-auth-token are
    # always removed.
    # redact_header X-Session X-Csrf-Token;
}

# Where operational messages (startup, connection errors, dropped log lines)
# go. Destination: stderr, stdout or a file. Level: error, warn, info or debug.
# Defaults to stderr info. SIGUSR1 reopens a file destination, and SIGHUP reloads
# the configuration (listen, worker_threads, max_connections and error_log apply at startup only).
# error_log /var/log/vigilant-heron/error.log warn;

# Access logs of requests, for every site that does not name its own. Repeatable.
# Destination: stdout, stderr, a file, or syslog:server=HOST:PORT[,tag=TAG]
# (UDP, RFC 3164). The format is optional: json (default) or main, or a name
# given with log_format. Default: access_log stdout json; when none is given.
# access_log off; disables them.
# access_log /var/log/vigilant-heron/access.log main;
# access_log syslog:server=192.0.2.10:514,tag=vigilant-heron main;

# A named log format. Variables: $time_iso8601 $time_local $msec $request_id
# $client_ip $remote_addr $site $host $method $path $status $action $reason
# $would_have $attack $ai_instruction $category $decision_error $retry_after
# $input_tokens $upstream_status $upstream_error $latency_ms, and $http_<name>
# for a request header (underscores become hyphens). Cookie, Authorization,
# Proxy-Authorization, X-Api-Key, X-Auth-Token and any redact_header cannot be
# logged.
# $upstream_status is the status the upstream answered with, or "-".
# $upstream_error names why the upstream gave no response: connect_timeout,
# connect_failed, read_timeout, send_timeout or upstream_failed.
# escape default (default) escapes quotes, backslashes and bytes outside
# 0x20-0x7e. escape json writes JSON string escapes. A missing value is "-" by
# default and an empty string with escape json.
# log_format main-ip escape=default "$time_iso8601 $client_ip $site \"$method $path\" $status $action $reason";

# Request-rate and connection limits, as in nginx (see the README, "Limits").
# Zones are defined at the top level and used in a site or a location. Limits run
# before the access list, so a limited request never reaches the backend. The key
# is built from variables known before the body is read: $client_ip, $remote_addr,
# $site, $host, $method, $path and $http_<name> (never a credential header). An
# empty key is not counted. zone=<name>:<size> holds size/128 states for
# limit_req and size/64 for limit_conn.
# limit_req_zone $client_ip zone=perip:10m rate=10r/s;
# limit_conn_zone $client_ip zone=conns:10m;
# limit_req_status 429;            # status of a rejected request; default 503
# limit_conn_status 429;           # default 503

# One site. Its hosts are the names after the keyword. Repeatable.
# Names may be exact (example.com), a leading wildcard (*.example.com), a
# trailing wildcard (example.*), .example.com (the name and its subdomains) or a
# regular expression (quoted: "~^(www\.)?example\.(com|jp)$"). Exact names win,
# then the longest leading wildcard, then the longest trailing wildcard, then the
# first regular expression in the file.
site example.com www.example.com {
    # default_server;   # takes the requests whose Host matches no site; at most one site

    upstream http://upstream:80;

    # enforce applies the verdict. shadow forwards everything and records what
    # would have happened. Deterministic rules apply in both modes.
    mode enforce;

    # Headers sent to the upstream, replacing the top-level list. The defaults
    # (Host kept, X-Forwarded-For appended) stay. Variables: $client_ip,
    # $remote_addr, $host, $site, $method, $path, $request_id, $http_<name>.
    # An empty value removes the header. Quote values that contain "${...}".
    # proxy_set_header X-Real-IP $client_ip;
    # proxy_set_header X-Forwarded-Proto "$http_x_forwarded_proto";

    # Tunnel HTTP/1.1 Upgrade requests (WebSocket) after the handshake is screened.
    # Only the handshake is judged; frames are not inspected. Default off.
    # proxy_websocket on;

    # block (403), or redirect <url> (302 to the given location).
    action block;
    # block_status 404;               # 4xx or 5xx, or 444 to close without a response
    # block_page blocked.html;        # HTML served for blocked requests, at most 64 KiB
    # action redirect https://example.com/blocked;

    # Attack score at or above which a request is an attack (0 to 1).
    block_threshold 0.87;

    # AI-instruction score at or above which a request is an attack (0 to 1).
    instruction_threshold 0.8;

    # What happens when the backend rate-limits the request (HTTP 429) or no
    # slot is free in time. Rules are not affected.
    on_rate_limit allow;

    # What happens when the backend fails in any other way.
    on_decision_error allow;

    # Path prefixes that are always blocked, without calling the backend.
    # Matched as a prefix of the normalized path (one percent-decode, dot
    # segments resolved, repeated slashes merged, then lowercased). So
    # /wp-config.php also covers /wp-config.php.bak. Review this list for each
    # site: some applications expose these paths on purpose, such as Spring
    # Boot apps that serve /actuator.
    deny_path /.env /.git /.svn/ /.hg/ /.ds_store /.aws/ /.ssh/ /.htpasswd /.htaccess;
    deny_path /wp-config.php /phpmyadmin /server-status /actuator /vendor/phpunit;

    # Path prefixes that are blocked whenever the decision fails, whatever the
    # failure and its setting above.
    fail_closed_path /wp-login.php /wp-admin;

    # Limits for one path. The location is chosen as nginx chooses it: an exact
    # "=" match first, then the longest prefix, a "^~" prefix ends the search,
    # then the regexes in file order, else the longest prefix. Inside a location
    # only the limit directives are allowed. Here a burst of two password guesses
    # on /wp-login.php passes, the next gets 429, and the rest of the site is not
    # limited. The decision model cannot see the rate of one client, so this is
    # the limit for guessing.
    # location = /wp-login.php {
    #     limit_req zone=perip burst=2 nodelay;
    #     limit_req_status 429;
    # }

    # This site's own access list. When it has any allow or deny line, it replaces
    # the top-level list.
    # allow 203.0.113.0/24;
    # deny all;

    # Built-in rules for this site only, and built-in ids to disable here.
    # builtin_rules off;
    # disable_rule vh-sqli-004;

    # Rules of this site only, in the rule syntax (see the README). A block rule
    # is checked before every skip rule.
    # rule example-login-probe {
    #     description "login probe with a fixed user agent";
    #     action block;
    #     method POST;
    #     path = /login;
    #     header user-agent ~* "^probe/";
    # }

    # File extensions of GET or HEAD requests with no query and no body that
    # skip the backend. Repeatable; when given, these replace the defaults.
    # static_extensions css js png jpg jpeg gif svg webp ico woff woff2 ttf map;

    # When on, responses carry x-vigilant-heron with action, reason and would_have.
    debug_headers off;

    # Site overrides of the body and upstream timers (the defaults are shown).
    # client_body_timeout 60s;       # between two reads of the request body from the client
    # client_max_body_size 1m;       # largest request body for this site; 0 is unlimited
    # proxy_connect_timeout 60s;     # time to connect to the upstream (504 when it expires)
    # proxy_read_timeout 60s;        # wait for the response head and between response reads (504)
    # proxy_send_timeout 60s;        # longest wait between two writes to the upstream (504)

    # This site's own access logs, instead of the top-level ones. Repeatable.
    # access_log /var/log/vigilant-heron/example.log json;
}
