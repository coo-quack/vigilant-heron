# Generated by eval/run.py. The @PLACEHOLDERS@ are filled in for each run.
listen @LISTEN@;

# Lets the harness join each request to its access-log line by the row id.
request_id_header x-request-id;

# The harness reads one line per request from this file.
access_log @ACCESS_LOG@ json;

client_max_body_size 10485760;
decision {
    backend @BACKEND@;
    model @MODEL@;
    url @DECISION_URL@;
    api_token_env @TOKEN_ENV@;
    # The evaluation measures model accuracy, so a timeout must not become a
    # fail-open allow. Latency is still reported.
    timeout 3000ms;
    inspect_body 8192;
}

default_status 421;

site eval.example.com {
    upstream @UPSTREAM@;
    mode enforce;
    action block;
    block_threshold 0.5;
    instruction_threshold 0.5;
    # No deny_path and no fail_closed_path lines: no deny rules and no
    # fail-closed paths. The syntax has no empty list, so static_extensions
    # names one extension that no dataset row uses. No row is skipped as
    # static, so every row reaches the backend.
    static_extensions zzz-no-row-uses-this;
    debug_headers on;
}
