# Generated by eval/run.py. The @PLACEHOLDERS@ are filled in for each run.
listen = "@LISTEN@"
log_format = "json"
# Lets the harness join each request to its decision event by the row id.
request_id_header = "x-request-id"

[decision]
backend = "@BACKEND@"
model = "@MODEL@"
url = "@DECISION_URL@"
api_token_env = "@TOKEN_ENV@"
# The evaluation measures model accuracy, so a timeout must not become a
# fail-open allow. Latency is still reported.
timeout_ms = 3000
inspect_body_bytes = 8192
max_body_bytes = 10485760
redact_headers = []

[default]
status = 421

[[sites]]
hosts = ["eval.example.com"]
upstream = "@UPSTREAM@"
mode = "enforce"
action = "block"
block_threshold = 0.5
instruction_threshold = 0.5
# Empty lists: no deny rules, no fail-closed paths and no static skip, so every
# row reaches the backend.
deny_paths = []
fail_closed_paths = []
static_extensions = []
debug_headers = true
