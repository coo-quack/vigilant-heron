# Generated by eval/run.py. The @PLACEHOLDERS@ are filled in for each run.
listen = "@LISTEN@"
log_format = "json"

[decision]
backend = "clef"
model = "clef-flash"
url = "@CLEF_URL@"
api_token_env = "CLOUDFLARE_AI_TOKEN"
timeout_ms = 10000
inspect_body_bytes = 8192
max_body_bytes = 10485760
redact_headers = []

[default]
status = 421

[[sites]]
hosts = ["eval.example.com"]
upstream = "@UPSTREAM@"
mode = "enforce"
action = "block"
block_threshold = 0.5
instruction_threshold = 0.5
# Empty lists: no deny rules, no fail-closed paths and no static skip, so every
# row reaches the backend.
deny_paths = []
fail_closed_paths = []
static_extensions = []
debug_headers = true
