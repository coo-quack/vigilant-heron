# cargo-deny configuration, run by the `audit` CI job.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
# Every advisory in the RustSec database fails the check, including
# unmaintained and yanked crates. Add an entry here only with a reason.
ignore = []

[licenses]
# Permissive licenses only, so the image and binaries can ship under MIT.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# Workspace crates are `publish = false`; their own license is checked by
# the allow list above like any other crate.
ignore = false

[bans]
multiple-versions = "warn"
# `version = "*"` dependencies are rejected: every dependency is pinned by a
# requirement that Renovate can update.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
# Only crates.io. A git or alternative-registry dependency is a supply-chain
# change and has to be allowed here explicitly.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
