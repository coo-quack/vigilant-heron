name: Audit

# The dependency audit has its own workflow so that the weekly schedule runs
# only this job, not all of CI. An advisory published while no PR is open is
# then caught within a week. The job name `audit` is a required check: keep it.
on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '23 19 * * 0' # Sunday 19:23 UTC = Monday 04:23 JST

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins the toolchain; rustup on the runner installs it
  # on the first cargo call, so no third-party toolchain action is needed.
  CARGO_DENY_VERSION: 0.20.2

jobs:
  # Advisories, licenses, banned crates and registry sources (deny.toml).
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}
      - run: command -v cargo-deny || cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
      - run: cargo deny --locked check
      # The documentation site's dependencies (docs/, package.json). pnpm comes
      # from corepack, which reads the packageManager field.
      - run: corepack enable pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
